[project]
name = "bank-lakehouse"
version = "0.1.0"
description = "A bank lakehouse in miniature: PySpark pipelines, a C# to Python migration proven by a parity test"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark==4.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_lakehouse"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
